[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["examples/basic", "fixtures"]

[workspace.package]
license = "MIT"
edition = "2024"

[workspace.dependencies]
smplx-macros = { path = "./crates/macros", version = "0.0.12" }
smplx-build = { path = "./crates/build", version = "0.0.12" }
smplx-test = { path = "./crates/test", version = "0.0.12" }
smplx-regtest = { path = "./crates/regtest", version = "0.0.12" }
smplx-sdk = { path = "./crates/sdk", version = "0.0.12", default-features = false }
smplx-std = { path = "./crates/simplex", version = "0.0.12" }
smplx-wasm = { path = "./crates/wasm", version = "0.0.12" }

serde = { version = "1.0.228", features = ["derive"] }
hex = { version = "0.4.3" }
hmac = { version = "0.12.1" }
sha2 = { version = "0.10.9", features = ["compress"] }
thiserror = { version = "2.0.18" }
toml = { version = "0.9.8" }
toml_edit = { version = "0.25.12" }
minreq = { version = "3.0.0", features = ["https", "json-using-serde"] }

electrsd = { version = "0.29.0", features = ["legacy"] }
bitcoincore-rpc = { version = "0.19.0" }

simplicityhl = { version = "0.7.2" }

[workspace.lints.rust]
rust_2018_idioms = "warn"
unused_lifetimes = "warn"
unreachable_pub = "warn"
deprecated_in_future = "warn"

[workspace.lints.clippy]
multiple_crate_versions = "allow"

# Sequentia's transaction encoding: rust-elements with the `sequentia` feature
# (the issuance denomination byte; the Bitcoin anchor in the block header), as
# vendored by SWK. `simplicityhl`, `simplicity-lang` and `elements-miniscript`
# all name crates.io `elements 0.25`, so a patch is the only way to give every
# one of them the same patched crate. A patch applies only in the workspace that
# declares it: a project depending on this fork declares the same patch (see
# SEQUENTIA.md).
[patch.crates-io]
elements = { git = "https://github.com/ConcatenaLabs/SWK", rev = "87a9f5e7f98356a2c00712884019079566aacfec" }
