# This example runs on a local Sequentia chain: `sequentiad` on PATH, or set
# `node_bin`. Comment out the `[regtest]` table below to run on Liquid regtest.
[regtest]
chain = "sequentia"

# DEFAULT CONFIG 

# [build]
# src_dir = "./simf"
# simf_files = ["*.simf"]
# out_dir = "./src/artifacts"

# [dependencies]
# some_dep = { git = "<git url>", path = "<or a relative path>" } 

# [regtest]
# mnemonic = "exist carry drive collect lend cereal occur much tiger just involve mean"
# bitcoins = 10_000_000
# rpc_port = 18443
# esplora_port = 3000
# rpc_user = "user"
# rpc_password = "password"
# node_bin = "<path to elementsd; default: elementsd on PATH>"
# electrs_bin = "<path to electrs; default: electrs on PATH>"

# [test]
# mnemonic = "exist carry drive collect lend cereal occur much tiger just involve mean"
# bitcoins = 10_000_000
# verbosity = 0

